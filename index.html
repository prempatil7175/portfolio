    // --- CUSTOM CURSOR ---
    const CustomCursor = () => {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [isHover, setIsHover] = useState(false);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;

        const onMouseMove = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
          if (!visible) setVisible(true);

          const target = e.target;
          const interactive = target.closest('a, button, input, textarea, [data-interactive="true"], .interactive-element');
          setIsHover(!!interactive);
        };

        const onLeave = () => setVisible(false);
        const onEnter = () => setVisible(true);

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onLeave);
        document.addEventListener('mouseenter', onEnter);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onLeave);
          document.removeEventListener('mouseenter', onEnter);
        };
      }, [visible]);

      if (!visible) return null;

      return (
        <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden no-print">
          <div
            className={`fixed top-0 left-0 rounded-full transition-transform duration-100 ease-out border ${
              isHover
                ? 'w-12 h-12 -ml-6 -mt-6 border-[#E50914] bg-[#E50914]/20 scale-125'
                : 'w-8 h-8 -ml-4 -mt-4 border-white/30'
            }`}
            style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)` }}
          />
          <div
            className={`fixed top-0 left-0 rounded-full transition-all duration-75 ease-out ${
              isHover
                ? 'w-3 h-3 -ml-1.5 -mt-1.5 bg-[#E50914] shadow-[0_0_12px_#E50914]'
                : 'w-1.5 h-1.5 -ml-[3px] -mt-[3px] bg-white'
            }`}
            style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)` }}
          />
        </div>
      );
    };

    // --- NAVBAR ---

      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [active, setActive] = useState('hero');

        { label: 'SKILLS', href: '#skills' },
        { label: 'CONTACT', href: '#contact' }

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 40);

          const ids = ['hero', 'experience', 'projects', 'recognition', 'skills', 'contact'];
          const pos = window.scrollY + 200;
          for (const id of ids) {
            const el = document.getElementById(id);
            if (el) {
              const top = el.offsetTop;
              const h = el.offsetHeight;
              if (pos >= top && pos < top + h) {
                setActive(id);
                break;
              }
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

                </div>

                <p className="text-base sm:text-lg md:text-xl text-[#A0A0A0] max-w-2xl font-body leading-relaxed pt-2">
                  Strategic and hands-on professional with <span className="text-white font-semibold">26 years</span> of extensive experience in managing large-scale electrical and automation systems.

                <div className="pt-6 flex flex-wrap items-center gap-4 sm:gap-6">
